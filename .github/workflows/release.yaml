name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate manifest
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate .

      - name: Pack extension
        run: npx --yes @anthropic-ai/mcpb@2.1.2 pack . openmarkets.mcpb

      - name: Attach extension
        run: gh release upload "$GITHUB_REF_NAME" openmarkets.mcpb --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
