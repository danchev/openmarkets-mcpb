name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release version
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          test "$GITHUB_REF_NAME" = "$manifest_version" || test "$GITHUB_REF_NAME" = "v$manifest_version"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          version: 0.12.2

      - name: Verify Open Markets dependency
        run: uv pip compile pyproject.toml --output-file "$RUNNER_TEMP/requirements.txt"

      - name: Verify launcher against published package
        run: uv run server/main.py --export-schema "$RUNNER_TEMP/openmarkets-tools.json"

      - name: Validate manifest
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate .

      - name: Pack extension
        run: npx --yes @anthropic-ai/mcpb@2.1.2 pack . openmarkets.mcpb

      - name: Attach extension
        run: gh release upload "$GITHUB_REF_NAME" openmarkets.mcpb --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
